spec:
  name: genkitkraft
  services:
    - name: genkitkraft
      image:
        registry_type: GHCR
        registry: deej4y
        repository: genkitkraft
        tag: latest
      http_port: 8080
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      health_check:
        http_path: /livez
      envs:
        - key: DATABASE_PROVIDER
          value: postgres
        - key: DATABASE_URL
          scope: RUN_TIME
          value: ${db.DATABASE_URL}
        - key: CACHE_PROVIDER
          value: valkey
        - key: CACHE_URL
          scope: RUN_TIME
          value: redis://valkey:6379
        - key: ENCRYPTION_KEY
          scope: RUN_TIME
          value: demo-key-change-me-0123456789abc
        - key: AUTH_CREDENTIALS
          scope: RUN_TIME
          value: admin:demo-change-me
        - key: PUBLIC_API_KEY
          scope: RUN_TIME
          value: sk-demo-change-me
    - name: valkey
      image:
        registry_type: DOCKER_HUB
        registry: valkey
        repository: valkey
        tag: 8-alpine
      run_command: valkey-server --maxmemory 64mb --maxmemory-policy noeviction
      internal_ports:
        - 6379
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
  databases:
    - name: db
      engine: PG
      production: false
